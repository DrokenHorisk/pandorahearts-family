# Build every production image before any deployment.
name: Validate and deploy PandoraHearts Family

# Production deploys are serialized and always back up PostgreSQL first.

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test damage engine
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build frontend production image
        run: docker build --file frontend/Dockerfile --tag pandorahearts-frontend:ci frontend
      - name: Build backend production image
        run: docker build --file backend/Dockerfile --tag pandorahearts-backend:ci backend
  deploy-production:
    # A manual Run workflow must deploy too; the previous push-only guard skipped this job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test-build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    concurrency:
      group: pandorahearts-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT: pandorahearts
      PRODUCTION_DIR: /home/droken/pandorahearts
      PRODUCTION_ENV_FILE: /home/droken/pandorahearts/.env
      RELEASE_DIR: /tmp/pandorahearts-release-${{ github.run_id }}
    defaults:
      run:
        shell: bash
        working-directory: /home/droken/pandorahearts
    steps:
      - name: Verify production directory
        run: |
          set -euo pipefail
          test -f docker-compose.yml
          test -d .git
          docker compose --project-name "$COMPOSE_PROJECT" config --quiet

      - name: Backup PostgreSQL
        run: |
          set -euo pipefail
          backup_dir=/home/droken/pandorahearts-backups
          mkdir -p "$backup_dir"
          backup_file="$backup_dir/pandorahearts_$(date +%Y%m%d_%H%M%S).sql"
          docker compose --project-name "$COMPOSE_PROJECT" exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$backup_file"
          test -s "$backup_file"
          echo "Backup created: $backup_file"

      - name: Update source safely
        run: |
          set -euo pipefail
          git -C "$PRODUCTION_DIR" fetch origin main
          git -C "$PRODUCTION_DIR" worktree add --detach "$RELEASE_DIR" "$GITHUB_SHA"
          test -f "$RELEASE_DIR/docker-compose.yml"
          docker compose --project-name "$COMPOSE_PROJECT" --env-file "$PRODUCTION_ENV_FILE" --file "$RELEASE_DIR/docker-compose.yml" config --quiet

      - name: Build and restart services
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d)"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          docker compose --project-name "$COMPOSE_PROJECT" --env-file "$PRODUCTION_ENV_FILE" --file "$RELEASE_DIR/docker-compose.yml" up -d --build

      - name: Verify production
        run: |
          set -euo pipefail
          docker compose --project-name "$COMPOSE_PROJECT" --env-file "$PRODUCTION_ENV_FILE" --file "$RELEASE_DIR/docker-compose.yml" ps
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3001/calculator >/dev/null; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Production health check failed" >&2
          docker compose --project-name "$COMPOSE_PROJECT" --env-file "$PRODUCTION_ENV_FILE" --file "$RELEASE_DIR/docker-compose.yml" logs --tail=100 backend frontend
          exit 1

      - name: Synchronize NosWiki game database
        run: |
          set -euo pipefail
          timeout 10m docker compose --project-name "$COMPOSE_PROJECT" --env-file "$PRODUCTION_ENV_FILE" --file "$RELEASE_DIR/docker-compose.yml" exec -T backend python - <<'PY'
          from api.db import SessionLocal
          from api.noswiki import sync_all

          db = SessionLocal()
          try:
              counts = sync_all(db)
              print("NosWiki synchronized:", counts)
          finally:
              db.close()
          PY

      - name: Remove temporary release checkout
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$RELEASE_DIR" ]; then
            git -C "$PRODUCTION_DIR" worktree remove "$RELEASE_DIR"
          fi
